<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230"
     viewBox="0 0 880 230" role="img" aria-labelledby="title description">
  <title id="title">GitHub Stats dan Most Used Languages</title>
  <desc id="description">Kontribusi · 365 hari: 123. Hari aktif · 365 hari: 18. Repo proyek publik: 2. Bintang di repo proyek: 1. Persentase byte kode pada repo proyek publik. TypeScript 60.3%, CSS 29.1%, JavaScript 9.9%, HTML 0.7%</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #00293c; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .italic { font-style: italic; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1px; }
    .muted { fill: #45605d; }
    .accent { fill: #1e656d; }
    .light { fill: #f1f3ce; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="229" rx="16" fill="none" stroke="none"/>
