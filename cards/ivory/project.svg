<svg xmlns="http://www.w3.org/2000/svg" width="880" height="137"
     viewBox="0 0 880 137" role="img" aria-labelledby="title description">
  <title id="title">Computer Systems Fundamentals</title>
  <desc id="description">Repositori catatan belajar dan lab praktik.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #00293c; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .italic { font-style: italic; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1px; }
    .muted { fill: #45605d; }
    .accent { fill: #1e656d; }
    .light { fill: #f1f3ce; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="136" rx="16" fill="#f1f3ce" stroke="none"/>
  <g class="enter" style="animation-delay:1560ms"><rect x="39" y="30" width="8" height="8" rx="1" fill="#1e656d" stroke="none"/><text x="58" y="39" class="mono muted" font-size="12" font-weight="400" text-anchor="start">REPO BELAJAR</text><text x="38" y="79" class="serif" font-size="36" font-weight="400" text-anchor="start">Computer Systems Fundamentals</text><text x="39" y="111" class="muted" font-size="19" font-weight="400" text-anchor="start">Dari hardware dan sistem operasi hingga jaringan, dengan lab terminal.</text><text x="841" y="77" class="accent" font-size="28" font-weight="400" text-anchor="end">↗</text></g>
</svg>
