<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290"
     viewBox="0 0 880 290" role="img" aria-labelledby="title description">
  <title id="title">Kontribusi per bulan</title>
  <desc id="description">21 kontribusi dalam 365 hari. 11 hari aktif. Rentetan terpanjang 1 hari. Hari tersibuk 16 Jun · 4. Bulan di ujung grafik dapat berupa bulan parsial.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #00293c; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .italic { font-style: italic; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1px; }
    .muted { fill: #45605d; }
    .accent { fill: #1e656d; }
    .light { fill: #f1f3ce; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="289" rx="16" fill="#f1f3ce" stroke="none"/>
