<svg xmlns="http://www.w3.org/2000/svg" width="280" height="157"
     viewBox="0 0 280 157" role="img" aria-labelledby="title description">
  <title id="title">Jaringan</title>
  <desc id="description">TCP/IP dan DNS Routing dan socket</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #00293c; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .italic { font-style: italic; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1px; }
    .muted { fill: #45605d; }
    .accent { fill: #1e656d; }
    .light { fill: #f1f3ce; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="279" height="156" rx="16" fill="#1e656d" stroke="none"/>
  <g class="enter" style="animation-delay:1380ms"><text x="22" y="69" class="serif italic light" font-size="38" font-weight="400" text-anchor="start">Jaringan</text><text x="254" y="35" class="light" font-size="21" font-weight="400" text-anchor="end">↗</text><text x="23" y="105" class="light" font-size="17" font-weight="400" text-anchor="start">TCP/IP dan DNS</text><text x="23" y="131" class="light" font-size="17" font-weight="400" text-anchor="start">Routing dan socket</text></g>
</svg>
