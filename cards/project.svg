<svg xmlns="http://www.w3.org/2000/svg" width="880" height="137"
     viewBox="0 0 880 137" role="img" aria-labelledby="title description">
  <title id="title">Computer Systems Fundamentals</title>
  <desc id="description">Repositori catatan belajar dan lab praktik.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #edf3f1; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1.25px; }
    .muted { fill: #a6b5b9; }
    .mint { fill: #82e3c0; }
    .amber { fill: #f3c580; }
    .blue { fill: #a5c9ff; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="136" rx="16" fill="#12191e" stroke="#303e46"/>
  <g class="enter" style="animation-delay:1240ms"><text x="34" y="35" class="mono amber" font-size="13" font-weight="700" text-anchor="start">REPO BELAJAR</text><text x="33" y="77" class="" font-size="37" font-weight="730" text-anchor="start">Computer Systems Fundamentals</text><text x="34" y="109" class="muted" font-size="19" font-weight="400" text-anchor="start">Dari hardware dan sistem operasi hingga jaringan, dengan lab terminal.</text><text x="846" y="76" class="amber" font-size="32" font-weight="400" text-anchor="end">↗</text></g>
</svg>
