  <title id="title">GitHub Stats dan Most Used Languages</title>
  <desc id="description">Kontribusi · 365 hari: 152. Hari aktif · 365 hari: 22. Repo proyek publik: 2. Bintang di repo proyek: 1. Persentase byte kode pada repo proyek publik. TypeScript 58.0%, CSS 30.7%, JavaScript 10.6%, HTML 0.6%</desc>
