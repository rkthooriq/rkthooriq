<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268"
     viewBox="0 0 880 268" role="img" aria-labelledby="title description">
  <title id="title">Raditya Kemal Thooriq</title>
  <desc id="description">Catatan belajar sistem komputer dan praktik Linux.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #edf3f1; }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 1.25px; }
    .muted { fill: #a6b5b9; }
    .mint { fill: #82e3c0; }
    .amber { fill: #f3c580; }
    .blue { fill: #a5c9ff; }

    @media (prefers-reduced-motion: no-preference) {
      .enter { animation: enter 520ms cubic-bezier(.2,.65,.3,1) both; }
      .cell { animation: reveal 420ms ease-out both; }
      .bar { animation: grow 520ms ease-out both; transform-origin: center bottom;
             transform-box: fill-box; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes grow { from { transform: scaleY(0); } }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="267" rx="16" fill="#12191e" stroke="#303e46"/>
  <g class="enter" style="animation-delay:0ms"><text x="34" y="40" class="mono mint" font-size="13" font-weight="700" text-anchor="start">CATATAN BELAJAR SISTEM</text><text x="32" y="100" class="" font-size="54" font-weight="750" text-anchor="start">Raditya Kemal</text><text x="32" y="157" class="" font-size="54" font-weight="750" text-anchor="start">Thooriq</text><text x="35" y="197" class="muted" font-size="22" font-weight="400" text-anchor="start">Sistem komputer dan praktik Linux</text><text x="35" y="236" class="mono mint" font-size="15" font-weight="400" text-anchor="start">@rkthooriq</text></g><rect x="598" y="31" width="248" height="206" rx="10" fill="#171f25" stroke="#334149"/><g class="enter" style="animation-delay:180ms"><rect x="620" y="48" width="204" height="42" rx="6" fill="#202b32" stroke="none"/><rect x="634" y="65" width="8" height="8" rx="2" fill="#82e3c0" stroke="none"/><text x="654" y="74" class="mono" font-size="15" font-weight="400" text-anchor="start">Hardware</text><path d="M639 90L639 110" fill="none" stroke="#667981"/></g><g class="enter" style="animation-delay:290ms"><rect x="620" y="110" width="204" height="42" rx="6" fill="#202b32" stroke="none"/><rect x="634" y="127" width="8" height="8" rx="2" fill="#a5c9ff" stroke="none"/><text x="654" y="136" class="mono" font-size="15" font-weight="400" text-anchor="start">Sistem operasi</text><path d="M639 152L639 172" fill="none" stroke="#667981"/></g><g class="enter" style="animation-delay:400ms"><rect x="620" y="172" width="204" height="42" rx="6" fill="#202b32" stroke="none"/><rect x="634" y="189" width="8" height="8" rx="2" fill="#f3c580" stroke="none"/><text x="654" y="198" class="mono" font-size="15" font-weight="400" text-anchor="start">Aplikasi</text></g>
</svg>
