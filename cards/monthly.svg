<svg xmlns="http://www.w3.org/2000/svg" width="880" height="313"
     viewBox="0 0 880 313" role="img" aria-labelledby="title description">
  <title id="title">Kontribusi per bulan</title>
  <desc id="description">11 hari aktif. Rentetan terpanjang 1 hari. Hari tersibuk 16 Jun · 4. Bulan di ujung grafik dapat berupa bulan parsial.</desc>
  <style>
