name: Refresh profile contributions

"on":
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'rkthooriq/rkthooriq'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch the public GitHub calendar
        run: python3 scripts/fetch_contributions.py rkthooriq
      - name: Render contribution cards
        run: python3 scripts/render_readme_cards.py
      - name: Commit updated contribution data and cards
        run: |
          git add -- data/contributions.json cards/calendar.svg cards/monthly.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: refresh profile contributions"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
